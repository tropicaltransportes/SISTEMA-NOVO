name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  check-prod-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify production has every local migration applied
        env:
          PROD_DB_URL: ${{ secrets.SUPABASE_PROD_DB_URL }}
        run: |
          if [ -z "$PROD_DB_URL" ]; then
            echo "::error::Secret SUPABASE_PROD_DB_URL is not set — cannot verify production schema before deploying. Refusing to deploy blind."
            exit 1
          fi

          applied="$(psql "$PROD_DB_URL" -Atqc "select version from supabase_migrations.schema_migrations order by version;")"
          missing=0
          for f in supabase/migrations/*.sql; do
            version="$(basename "$f" | cut -d'_' -f1)"
            if ! grep -qx "$version" <<< "$applied"; then
              echo "::error::Migration not applied to production: $(basename "$f")"
              missing=1
            fi
          done

          if [ "$missing" = "1" ]; then
            echo ""
            echo "Production schema is behind the migrations in this branch. Aborting deploy — apply the missing migration(s) to production first (supabase db push --project-ref <prod ref>), then re-run this workflow."
            exit 1
          fi
          echo "Production schema is up to date with all local migrations."

  build:
    needs: check-prod-schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Build
        working-directory: frontend
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
